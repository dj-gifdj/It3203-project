<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 220" role="img" aria-labelledby="t d">
  <title id="t">Browser window illustration</title>
  <desc id="d">A simple illustration of a browser window with an address bar and a rendered page.</desc>
  <rect width="500" height="220" fill="#eef3f6"/>
  <rect x="60" y="20" width="380" height="180" rx="8" fill="#ffffff" stroke="#1b3a5c" stroke-width="3"/>
  <rect x="60" y="20" width="380" height="30" rx="8" fill="#1b3a5c"/>
  <circle cx="78" cy="35" r="5" fill="#e76f51"/>
  <circle cx="95" cy="35" r="5" fill="#e9c46a"/>
  <circle cx="112" cy="35" r="5" fill="#2a9d8f"/>
  <rect x="140" y="27" width="270" height="16" rx="8" fill="#eaf2f8"/>
  <text x="150" y="39" font-family="Verdana" font-size="10" fill="#1b3a5c">https://example.com</text>
  <!-- rendered content -->
  <rect x="80" y="65" width="340" height="18" fill="#2a9d8f"/>
  <rect x="80" y="95" width="200" height="10" fill="#c9d3dc"/>
  <rect x="80" y="112" width="250" height="10" fill="#c9d3dc"/>
  <rect x="80" y="129" width="180" height="10" fill="#c9d3dc"/>
  <rect x="80" y="155" width="100" height="30" rx="4" fill="#1b3a5c"/>
  <text x="130" y="175" font-family="Verdana" font-size="10" text-anchor="middle" fill="#fff">Learn More</text>
</svg>
