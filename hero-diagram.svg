<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" role="img" aria-labelledby="title desc">
  <title id="title">Client-server diagram</title>
  <desc id="desc">A browser on the left sends a request over the internet to a web server on the right, which sends back a response.</desc>
  <rect width="600" height="200" fill="#f7f9fb"/>
  <!-- browser box -->
  <rect x="20" y="60" width="150" height="90" rx="10" fill="#ffffff" stroke="#1b3a5c" stroke-width="3"/>
  <rect x="20" y="60" width="150" height="22" rx="10" fill="#1b3a5c"/>
  <circle cx="35" cy="71" r="4" fill="#e76f51"/>
  <circle cx="48" cy="71" r="4" fill="#e9c46a"/>
  <circle cx="61" cy="71" r="4" fill="#2a9d8f"/>
  <text x="95" y="120" font-family="Verdana" font-size="16" text-anchor="middle" fill="#1b3a5c">Browser</text>

  <!-- server box -->
  <rect x="430" y="50" width="150" height="110" rx="10" fill="#ffffff" stroke="#2a9d8f" stroke-width="3"/>
  <rect x="445" y="65" width="120" height="16" fill="#2a9d8f"/>
  <rect x="445" y="90" width="120" height="16" fill="#2a9d8f"/>
  <rect x="445" y="115" width="120" height="16" fill="#2a9d8f"/>
  <text x="505" y="150" font-family="Verdana" font-size="16" text-anchor="middle" fill="#1b3a5c">Web Server</text>

  <!-- arrows -->
  <line x1="175" y1="95" x2="425" y2="95" stroke="#2a9d8f" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="300" y="85" font-family="Verdana" font-size="13" text-anchor="middle" fill="#2a9d8f">HTTP Request</text>

  <line x1="425" y1="130" x2="175" y2="130" stroke="#1b3a5c" stroke-width="3" marker-end="url(#arrow2)"/>
  <text x="300" y="150" font-family="Verdana" font-size="13" text-anchor="middle" fill="#1b3a5c">HTTP Response</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2a9d8f"/>
    </marker>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1b3a5c"/>
    </marker>
  </defs>
</svg>
